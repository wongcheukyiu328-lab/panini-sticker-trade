<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ Panini 世界盃貼紙交換板</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang HK", "Microsoft JhengHei", sans-serif; color:#12261a;
    background:#1f7a34;
    background-image:
      radial-gradient(circle at 50% -10%, rgba(255,255,255,.10), transparent 60%),
      repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 70px, rgba(0,0,0,.05) 70px 140px);
    padding:16px; }
  .banner { position:relative; overflow:hidden; background:linear-gradient(135deg,#0a3d18,#12622b 60%,#0a3d18);
    color:#fff; border-radius:16px; padding:16px 20px; margin-bottom:14px; border:2px solid rgba(255,255,255,.18);
    box-shadow:0 6px 18px rgba(0,0,0,.25); }
  .banner::before{ content:""; position:absolute; right:-40px; top:50%; transform:translateY(-50%);
    width:180px; height:180px; border:3px solid rgba(255,255,255,.12); border-radius:50%; }
  .banner::after{ content:""; position:absolute; right:48px; top:0; bottom:0; width:3px; background:rgba(255,255,255,.12); }
  .banner h1 { font-size:21px; letter-spacing:.3px; display:flex; align-items:center; gap:8px; }
  .banner .sub { color:#d3ecd8; font-size:12.5px; margin-top:3px; max-width:78%; }
  .toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px;
    background:rgba(255,255,255,.94); border-radius:12px; padding:10px 12px; box-shadow:0 3px 10px rgba(0,0,0,.15); }
  .toolbar input, .toolbar select, .toolbar button { font-size:13px; padding:7px 10px; border:1px solid #ccd0d5; border-radius:8px; background:#fff; }
  .toolbar button { cursor:pointer; background:#e4e6eb; font-weight:600; }
  .toolbar button:hover { background:#d8dadf; }
  .toolbar button.primary { background:#1f7a34; color:#fff; border-color:#1f7a34; }
  .toolbar .grow { flex:1; min-width:120px; }
  .toolbar label { font-size:13px; display:flex; align-items:center; gap:4px; }
  .board { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; align-items:start; }
  .col { background:rgba(255,255,255,.93); border-radius:12px; padding:10px; min-height:220px;
    box-shadow:0 4px 12px rgba(0,0,0,.18); backdrop-filter:saturate(1.1); }
  .col-head { display:flex; justify-content:space-between; align-items:center; padding:2px 4px 10px; font-weight:800; font-size:14px; gap:6px; }
  .col-head .cnt { background:#12261a; color:#fff; border-radius:20px; padding:2px 9px; font-size:11px; white-space:nowrap; font-weight:700; }
  .col.searching { border-top:5px solid #f0a500; }
  .col.have      { border-top:5px solid #7e57c2; }
  .col.give      { border-top:5px solid #e0416f; }
  .col.found     { border-top:5px solid #2e9e3f; }
  .dropzone { min-height:130px; border-radius:8px; padding:4px; }
  .dropzone.over { background:#d7efe0; outline:2px dashed #2e9e3f; }
  .grp { margin:9px 2px 4px; font-size:11px; font-weight:800; color:#5a6b60; text-transform:uppercase; letter-spacing:.4px; border-bottom:2px solid #dfe4e0; padding-bottom:3px; }
  .grp:first-child { margin-top:2px; }
  .person-hd { display:flex; justify-content:space-between; align-items:center; gap:6px; color:#12261a; text-transform:none; font-size:12px; }
  .person-hd .bulk { font-size:10px; font-weight:700; padding:2px 6px; border:1px solid #ccd0d5; border-radius:6px; background:#fff; cursor:pointer; white-space:nowrap; }
  .person-hd .bulk:hover { background:#eef0f2; }
  .row { display:flex; flex-wrap:wrap; gap:6px; }
  .country-row { display:flex; gap:8px; align-items:flex-start; padding:5px 2px; border-bottom:1px dotted #e0e6e1; }
  .country-row:last-child { border-bottom:none; }
  .country-label { flex:0 0 66px; font-weight:800; font-size:12.5px; display:flex; align-items:center; gap:4px; padding-top:5px; color:#12261a; }
  .country-label .flag { font-size:15px; }
  .country-chips { display:flex; flex-wrap:wrap; gap:5px; flex:1; min-width:0; }
  .card.compact { min-width:0; padding:5px 8px; align-items:center; }
  .card.compact .top { justify-content:center; }
  .card.compact .num { background:none; padding:0; font-size:13.5px; }
  .card.compact.shiny .num { background:none; }
  .card.compact.givecard, .card.compact.incoming { align-items:stretch; }
  .card { background:#fff; border-radius:9px; padding:6px 8px; font-size:13px; cursor:grab; box-shadow:0 1px 3px rgba(0,0,0,.16); user-select:none; display:flex; flex-direction:column; gap:3px; min-width:66px; transition:transform .05s; }
  .card:hover { transform:translateY(-1px); }
  .card:active { cursor:grabbing; }
  .card.dragging { opacity:.4; }
  .card.shiny { background:linear-gradient(135deg,#fff7d6,#ffe9a8); box-shadow:0 0 0 1px #e8c04d,0 1px 3px rgba(0,0,0,.18); }
  .card.givecard { cursor:default; }
  .card.sent { opacity:.5; }
  .card.incoming { border-left:3px solid #2e9e3f; }
  .card .top { display:flex; align-items:center; gap:4px; }
  .card .flag { font-size:15px; line-height:1; }
  .card .code { font-weight:800; letter-spacing:.3px; }
  .card .num { display:inline-block; background:#eef1ef; border-radius:5px; padding:0 5px; font-weight:700; }
  .card.shiny .num { background:#fbe9b0; }
  .card .person { font-size:11px; color:#1877f2; border:none; background:transparent; padding:2px 0 0; width:100%; outline:none; }
  .card .person::placeholder { color:#b0b3b8; }
  .card .tag { font-size:10px; color:#fff; font-weight:800; border-radius:5px; padding:1px 5px; align-self:flex-start; margin-top:1px; cursor:pointer; }
  .card .tag.trade { background:#1877f2; }
  .card .tag.gift  { background:#e0416f; }
  .card .tag.buy   { background:#e08a00; }
  .card .status { font-size:11px; padding:2px 4px; border:1px solid #ccd0d5; border-radius:6px; background:#fff; margin-top:2px; }
  .hidden { display:none !important; }
  .footer { margin-top:14px; font-size:12px; color:#eafff0; text-align:center; text-shadow:0 1px 2px rgba(0,0,0,.3); }
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px; }
  .modal { background:#fff; border-radius:14px; padding:16px 18px; max-width:600px; width:100%; max-height:88vh; overflow:auto; box-shadow:0 10px 40px rgba(0,0,0,.4); }
  .modal h2 { font-size:16px; margin-bottom:6px; }
  .modal h3 { font-size:14px; margin:12px 0 4px; }
  .modal textarea { width:100%; height:170px; font-family:ui-monospace,monospace; font-size:12px; line-height:1.5; border:1px solid #ccd0d5; border-radius:8px; padding:8px; resize:vertical; }
  .modal .mrow { display:flex; gap:8px; align-items:center; margin:6px 0 4px; }
  .modal .mrow button, .modal .close { padding:7px 12px; border-radius:8px; border:1px solid #ccd0d5; cursor:pointer; font-weight:700; font-size:13px; background:#e4e6eb; }
  .modal .mrow button { background:#1f7a34; color:#fff; border-color:#1f7a34; }
  .modal .close { float:right; }
  @media (max-width:900px){ .board{grid-template-columns:1fr 1fr;} }
  @media (max-width:560px){ .board{grid-template-columns:1fr;} .banner .sub{max-width:100%;} }
</style>

function codeIdx(c){ const i=CODE_ORDER.indexOf(c); return i<0?999:i; }
const seedMap = Object.fromEntries(SEED.map(c=>[c.id,c]));
let cards = load();

function load(){
  try { const s = localStorage.getItem(KEY); if(s){ return migrate(JSON.parse(s)); } } catch(e){}
  return JSON.parse(JSON.stringify(SEED));
}
function migrate(d){
  d.forEach(c=>{ const s=seedMap[c.id]; if(s){ ['group','iso','name','shiny','side','incoming'].forEach(k=>{ if(c[k]===undefined) c[k]=s[k]; }); } if(c.incoming&&!c.via) c.via='trade'; });
  return d;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(cards)); }catch(e){} }

function flag(iso){
  if(iso==='_SCO') return '🏴󠁧󠁢󠁳󠁣󠁴󠁿';
  if(iso==='_ENG') return '🏴󠁧󠁢󠁥󠁮󠁧󠁿';
  if(iso==='_FWC') return '🏆';
  if(!iso||iso.length!==2) return '🏳️';
  return iso.toUpperCase().replace(/./g,ch=>String.fromCodePoint(127397+ch.charCodeAt(0)));
}

function makeCard(c, compact){
  const el = document.createElement('div');
  const isGive = c.side==='give';
  const assigned = isGive && c.person && c.person.trim();
  el.className='card'+(compact?' compact':'')+(c.shiny?' shiny':'')+(isGive?' givecard':'')+(assigned&&c.status==='已寄出'?' sent':'')+(c.incoming&&!isGive?' incoming':'');
  el.draggable=!isGive; el.dataset.id=c.id;
  const star=c.shiny?'<span title="閃卡">✨</span>':'';
  el.innerHTML= compact
    ? '<div class="top"><span class="num">'+c.num+'</span>'+star+'</div>'
    : '<div class="top"><span class="flag">'+flag(c.iso)+'</span><span class="code">'+c.code+'</span><span class="num">'+c.num+'</span>'+star+'</div>';
  if(isGive){
    const inp=document.createElement('input');
    inp.className='person'; inp.placeholder='換俾邊個？'; inp.value=c.person||'';
    inp.addEventListener('input',e=>{ c.person=e.target.value; save(); });
    inp.addEventListener('change',()=>render());
    el.appendChild(inp);
    if(assigned){
      const sel=document.createElement('select'); sel.className='status';
      ['待寄出','已寄出'].forEach(s=>{ const o=document.createElement('option'); o.value=s; o.textContent=s; if((c.status||'待寄出')===s)o.selected=true; sel.appendChild(o); });
      sel.addEventListener('change',e=>{ c.status=e.target.value; save(); render(); });
      el.appendChild(sel);
    }
  } else if(c.incoming){
    const via=c.via||'trade';
    const d=document.createElement('div'); d.className='tag '+via;
    const label = via==='gift' ? '有人送' : via==='buy' ? '買咗' : '換到！';
    d.textContent = label;
    d.title = c.person ? ('來自 '+c.person) : '';
    d.addEventListener('click',ev=>{ ev.stopPropagation(); d.textContent = (d.textContent===label ? (c.person||'—') : label); });
    el.appendChild(d);
  }
  if(!isGive){
    el.addEventListener('dragstart',ev=>{ ev.dataTransfer.setData('text/plain',c.id); el.classList.add('dragging'); });
    el.addEventListener('dragend',()=>el.classList.remove('dragging'));
    if(c.col==='searching'){
      el.addEventListener('click',()=>{
        if(!c.incoming){ c.incoming=true; c.via='trade'; }
        else if((c.via||'trade')==='trade'){ c.via='gift'; }
        else if(c.via==='gift'){ c.via='buy'; }
        else { c.incoming=false; c.via=undefined; }
        save(); render();
      });
    }
  }
  el.title='單擊：換到！→有人送→買咗→清除　·　double-click 刪除';
  el.addEventListener('dblclick',()=>{ if(confirm('刪除 '+c.code+c.num+'？')){ cards=cards.filter(x=>x.id!==c.id); save(); render(); } });
  return el;
}

function buildLines(list){
  const isoOf={}; SEED.forEach(c=>isoOf[c.code]=c.iso);
  const map={};
  list.forEach(c=>{ (map[c.code]=map[c.code]||[]).push(c.num); });
  return CODE_ORDER.filter(code=>map[code]&&map[code].length).map(code=>({code, nums:[...new Set(map[code])].sort((a,b)=>a-b)}));
}
function drawSection(x,title,color,lines,y,pad,colW,gap,lh){
  x.fillStyle=color; x.fillRect(pad,y-2,4,20);
  x.fillStyle='#12261a'; x.font='700 16px sans-serif'; x.textAlign='left'; x.fillText(title, pad+10, y+14);
  y+=32;
  const rows=Math.max(1,Math.ceil(lines.length/2));
  for(let i=0;i<lines.length;i++){
    const col=Math.floor(i/rows), rowi=i%rows;
    const cx=pad+col*(colW+gap), cy=y+rowi*lh+13;
    const L=lines[i], head=L.code+'  ';
    x.font='800 14px sans-serif'; x.fillStyle='#0a3d18'; x.fillText(head, cx, cy);
    const hw=x.measureText(head).width;
    x.font='14px sans-serif'; x.fillStyle='#2a2f2c'; x.fillText(L.nums.join(', '), cx+hw, cy);
  }
  return y+rows*lh+10;
}
function imgOne(secTitle, sub, color, lines, fname){
  const W=760, pad=22, gap=22, lh=25, colW=(W-2*pad-gap)/2, titleH=78;
  const rows=Math.max(1,Math.ceil(lines.length/2));
  const H=titleH+22+(32+rows*lh+10)+pad;
  const scale=2, cv=document.createElement('canvas'); cv.width=W*scale; cv.height=H*scale;
  const x=cv.getContext('2d'); x.scale(scale,scale); x.textBaseline='alphabetic';
  x.fillStyle='#fff'; x.fillRect(0,0,W,H);
  x.fillStyle='#0f5a24'; x.fillRect(0,0,W,titleH);
  x.fillStyle='#fff'; x.font='800 22px sans-serif'; x.fillText('⚽ FIFA World Cup 2026 貼紙交換', pad, 40);
  const total=lines.reduce((s,l)=>s+l.nums.length,0);
  x.font='13px sans-serif'; x.fillStyle='#cfe8d6'; x.fillText(sub+' · 共 '+total+' 張', pad, 62);
  drawSection(x, secTitle, color, lines, titleH+22, pad, colW, gap, lh);
  cv.toBlob(b=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=fname; a.click(); },'image/jpeg',0.92);
}
function linesToText(title, lines){
  const d=new Date(), ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const total=lines.reduce((s,l)=>s+l.nums.length,0);
  let s='【'+title+'】共 '+total+' 張 ('+ds+')\n';
  lines.forEach(l=> s+= l.code+': '+l.nums.join(',')+'\n');
  return s.trim();
}
function copyText(txt, btn){
  const ok=()=>{ const t=btn.textContent; btn.textContent='✓ 已複製'; setTimeout(()=>btn.textContent=t,1300); };
  const fb=()=>{ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} ta.remove(); ok(); };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(ok).catch(fb); } else fb();
}
function exportText(){
  const need=buildLines(cards.filter(c=>c.side!=='give'&&c.col==='searching'&&!c.incoming));
  const have=buildLines(cards.filter(c=>c.side==='give'&&!(c.person&&c.person.trim())));
  const wantTxt=linesToText('徵求 WANT', need);
  const haveTxt=linesToText('有得換 HAVE', have);
  const bg=document.createElement('div'); bg.className='modal-bg';
  bg.addEventListener('click',e=>{ if(e.target===bg) bg.remove(); });
  const m=document.createElement('div'); m.className='modal'; bg.appendChild(m);
  const close=document.createElement('button'); close.className='close'; close.textContent='✕ 關閉'; close.onclick=()=>bg.remove(); m.appendChild(close);
  const hd=document.createElement('h2'); hd.textContent='📋 貼文文字（可 copy 落 FB）'; m.appendChild(hd);
  function block(title,txt,btnLabel){
    const h=document.createElement('h3'); h.textContent=title; m.appendChild(h);
    const ta=document.createElement('textarea'); ta.readOnly=true; ta.value=txt;
    ta.addEventListener('focus',()=>ta.select()); m.appendChild(ta);
    const row=document.createElement('div'); row.className='mrow';
    const b=document.createElement('button'); b.textContent=btnLabel; b.onclick=()=>copyText(txt,b);
    row.appendChild(b); m.appendChild(row);
  }
  block('🔍 徵求 WANT', wantTxt, '📋 複製徵求');
  block('🔄 有得換 HAVE', haveTxt, '📋 複製有得換');
  document.body.appendChild(bg);
}
function exportImage(){
  const need=buildLines(cards.filter(c=>c.side!=='give'&&c.col==='searching'&&!c.incoming));
  const have=buildLines(cards.filter(c=>c.side==='give'&&!(c.person&&c.person.trim())));
  const d=new Date(), ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  imgOne('🔍 我哋徵求 (WANT)', '徵 · '+ds, '#f0a500', need, 'panini_WANT_'+ds+'.jpg');
  setTimeout(()=>imgOne('🔄 我哋有得換 (HAVE)', '可換 · '+ds, '#7e57c2', have, 'panini_HAVE_'+ds+'.jpg'), 600);
}

function countryRows(parent, list){
  const codes=[...new Set(list.map(c=>c.code))].sort((a,b)=>codeIdx(a)-codeIdx(b));
  codes.forEach(code=>{
    const cc=list.filter(c=>c.code===code).sort((a,b)=>a.num-b.num);
    const row=document.createElement('div'); row.className='country-row';
    const lab=document.createElement('span'); lab.className='country-label';
    lab.innerHTML='<span class="flag">'+flag(cc[0].iso)+'</span>'+code;
    row.appendChild(lab);
    const chips=document.createElement('div'); chips.className='country-chips';
    cc.forEach(c=>chips.appendChild(makeCard(c,true)));
    row.appendChild(chips);
    parent.appendChild(row);
  });
}
function fillZone(zoneId, list){
  const zone=document.getElementById(zoneId); zone.innerHTML='';
  GROUP_ORDER.forEach(grp=>{
    const g=list.filter(c=>c.group===grp);
    if(!g.length) return;
    const h=document.createElement('div'); h.className='grp'; h.textContent=grp; zone.appendChild(h);
    countryRows(zone, g);
  });
}
function fillZoneByPerson(zoneId, list){
  const zone=document.getElementById(zoneId); zone.innerHTML='';
  const persons=[...new Set(list.map(c=>c.person.trim()))].sort((a,b)=>a.localeCompare(b));
  persons.forEach(pn=>{
    const g=list.filter(c=>c.person.trim()===pn)
      .sort((a,b)=>{ const ga=GROUP_ORDER.indexOf(a.group),gb=GROUP_ORDER.indexOf(b.group); return ga!==gb?ga-gb : (a.code===b.code?a.num-b.num:a.code.localeCompare(b.code)); });
    if(!g.length) return;
    const sent=g.filter(c=>c.status==='已寄出').length;
    const allSent=sent===g.length;
    const h=document.createElement('div'); h.className='grp person-hd';
    h.innerHTML='<span>👤 '+pn+' ('+sent+'/'+g.length+' 已寄)</span>';
    const btn=document.createElement('button'); btn.className='bulk';
    btn.textContent=allSent?'↩ 全部待寄':'✅ 全部已寄';
    btn.addEventListener('click',()=>{ g.forEach(c=>c.status=allSent?'待寄出':'已寄出'); save(); render(); });
    h.appendChild(btn);
    zone.appendChild(h);
    countryRows(zone, g);
  });
}
function passFilter(c){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const fg=document.getElementById('filterGroup').value;
  const fc=document.getElementById('filterCountry').value;
  const so=document.getElementById('shinyOnly').checked;
  const label=(c.code+' '+c.num).toLowerCase();
  const mq=!q||label.includes(q)||(c.name||'').toLowerCase().includes(q);
  return mq && (!fg||c.group===fg) && (!fc||c.code===fc) && (!so||c.shiny);
}

function render(){
  const searching=cards.filter(c=>c.side!=='give'&&c.col==='searching');
  fillZone('zone-searching', searching.filter(passFilter));
  const stillNeed=searching.filter(c=>!c.incoming).length;
  const secured=searching.length-stillNeed;
  document.getElementById('cnt-searching').textContent = secured>0 ? stillNeed+' · ✅'+secured : ''+stillNeed;

  const found=cards.filter(c=>c.side!=='give'&&c.col==='found');
  fillZone('zone-found', found.filter(passFilter));
  document.getElementById('cnt-found').textContent=found.length;

  const haveList=cards.filter(c=>c.side==='give'&&!(c.person&&c.person.trim()));
  fillZone('zone-have', haveList.filter(passFilter));
  document.getElementById('cnt-have').textContent=haveList.length;

  const giveList=cards.filter(c=>c.side==='give'&&c.person&&c.person.trim());
  fillZoneByPerson('zone-give', giveList.filter(passFilter));
  const sent=giveList.filter(c=>c.status==='已寄出').length;
  document.getElementById('cnt-give').textContent='已寄 '+sent+' / '+giveList.length;

  document.getElementById('total').textContent=cards.length;
}

document.querySelectorAll('.dropzone[data-col]').forEach(zone=>{
  zone.addEventListener('dragover',e=>{ e.preventDefault(); zone.classList.add('over'); });
  zone.addEventListener('dragleave',()=>zone.classList.remove('over'));
  zone.addEventListener('drop',e=>{
    e.preventDefault(); zone.classList.remove('over');
    const id=e.dataTransfer.getData('text/plain');
    const c=cards.find(x=>x.id===id);
    if(c&&c.side!=='give'){ c.col=zone.dataset.col; if(c.col==='found') c.incoming=false; save(); render(); }
  });
});

const gsel=document.getElementById('filterGroup');
GROUP_ORDER.forEach(g=>{ const o=document.createElement('option'); o.value=g; o.textContent=g; gsel.appendChild(o); });
const csel=document.getElementById('filterCountry');
[...new Set(SEED.map(c=>c.code))].forEach(code=>{ const o=document.createElement('option'); o.value=code; o.textContent=code; csel.appendChild(o); });
document.getElementById('search').addEventListener('input',render);
gsel.addEventListener('change',render);
csel.addEventListener('change',render);
document.getElementById('shinyOnly').addEventListener('change',render);

document.getElementById('addBtn').addEventListener('click',()=>{
  const side=confirm('係咪「我哋有」嘅 duplicate？\n\n確定=我哋有(可換)  ·  取消=我哋搵緊(需要)')?'give':'get';
  const code=prompt('國家 code (例 MEX)：'); if(!code) return;
  const num=prompt('號碼：'); if(!num) return;
  const cc=code.toUpperCase().trim(); const base=(side==='give'?'GIVE:':'')+cc+'-'+num.trim();
  let id=base,i=2; while(cards.find(x=>x.id===id)){ id=base+'#'+i; i++; }
  const s=seedMap[cc+'-'+num.trim()]||seedMap['GIVE:'+cc+'-'+num.trim()];
  cards.push({id,code:cc,name:s?s.name:cc,num:parseInt(num)||num.trim(),group:s?s.group:'World Cup',iso:s?s.iso:'',
    shiny:s?s.shiny:(cc==='FWC'||num.trim()==='1'),side,col:side==='give'?'give':'searching',
    person:'',status:side==='give'?'待寄出':undefined});
  save(); render();
});
document.getElementById('imgBtn').addEventListener('click',exportImage);
document.getElementById('txtBtn').addEventListener('click',exportText);
document.getElementById('exportBtn').addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify(cards,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='panini_board_backup.json'; a.click();
});
document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ cards=migrate(JSON.parse(r.result)); save(); render(); alert('匯入成功'); }catch(err){ alert('檔案格式錯誤'); } };
  r.readAsText(f);
});
document.getElementById('resetBtn').addEventListener('click',()=>{
  if(confirm('重設會回到最初狀態，清走你嘅記錄。確定？')){ cards=JSON.parse(JSON.stringify(SEED)); save(); render(); }
});

render();
</script>
</body>
</html>
